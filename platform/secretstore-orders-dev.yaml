# platform/secretstore-orders-dev.yaml
# Instantiated from platform/secretstore.yaml for the real home-lab cluster.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: orders-dev
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "orders-dev"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "orders-dev"
