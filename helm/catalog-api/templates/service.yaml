apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  # ClusterIP (the default) is deliberate: this Service is never meant to
  # be reachable from outside the cluster. There is no Ingress template
  # in this chart at all - see values.yaml comment.
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
