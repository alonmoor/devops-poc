# platform/secretstore.yaml
#
# WORKING ASSUMPTION: this is applied once per namespace by a platform-
# owned ArgoCD Application (bootstrap tier, synced before any app-level
# ApplicationSet) - app teams never see or edit this file. It is the
# trust anchor that lets ExternalSecret objects in each app's own Helm
# chart (helm/*/templates/externalsecret.yaml) pull from Vault without
# the app team ever handling a Vault token directly.
#
# One instance of this file exists per namespace; only NAMESPACE_PLACEHOLDER
# changes. In the real repo this would be templated once via the same
# Terraform namespace module (terraform/modules/namespace) that created
# the matching vault_kubernetes_auth_backend_role - the role_name there
# equals the namespace name, which is exactly what `role:` references
# below.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: NAMESPACE_PLACEHOLDER   # e.g. catalog-dev, orders-staging, catalog-prod
spec:
  provider:
    vault:
      server: "https://vault.internal.example.com"
      path: "secret"                # KV v2 mount
      version: "v2"
      auth:
        kubernetes:
          # Vault validates this ServiceAccount's token against the
          # Kubernetes API (TokenReview) - no static credential is stored
          # anywhere in this manifest or in Git.
          mountPath: "kubernetes"
          role: "NAMESPACE_PLACEHOLDER"   # matches terraform's vault_kubernetes_auth_backend_role.role_name
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: NAMESPACE_PLACEHOLDER
