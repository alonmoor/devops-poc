{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only traffic that has already passed through the ingress controller
    # may reach this pod - matched by namespace, since the controller pod
    # itself is managed outside this app's charts.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - protocol: TCP
          port: 8080


  egress:
    # 1) Allowed to call catalog-api specifically in catalog-dev - and
    #    NOTHING else in-cluster. Both namespaceSelector and podSelector
    #    sit under the same "to" list item on purpose (AND, not OR) -
    #    mirrors the ingress-side fix in catalog-api's NetworkPolicy.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.catalogApiNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-api
      ports:
        - protocol: TCP
          port: 8080

    # 2) DNS - without this, service-name resolution itself breaks and
    #    the pod can't even find catalog-api's ClusterIP.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
