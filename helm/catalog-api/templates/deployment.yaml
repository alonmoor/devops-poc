apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Rolling update by default across all envs - Blue/Green and Canary are
  # handled one layer up, via ArgoCD Rollouts (Argo Rollouts CRD) rather
  # than baked into every service's Deployment. See docs/DECISIONS.md
  # ("Rollout strategy") for why that split was chosen.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never drop below desired replica count
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
      annotations:
        # Forces a pod restart when secret content changes, even though
        # the Deployment spec itself didn't change - ESO updates the
        # underlying Secret object in place, which doesn't trigger a
        # rollout on its own.
        checksum/secret: {{ .Values.secrets.enabled | ternary (printf "%v" .Release.Revision) "none" }}
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pycache
          emptyDir: {}
      serviceAccountName: {{ include "app.name" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          {{- if .Values.secrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "app.name" . }}-secret
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}      
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pycache
              mountPath: /app/src/__pycache__    
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
