# platform/secretstore-catalog-dev.yaml
# Instantiated from platform/secretstore.yaml for the real home-lab cluster.
# server/path point at the in-cluster dev-mode Vault installed via
# `helm install vault hashicorp/vault -n vault --set server.dev.enabled=true`
# (HTTP, not HTTPS, because dev mode has no TLS listener).

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: catalog-dev
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "catalog-dev"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "catalog-dev"
