{{- if .Values.secrets.enabled }}
# WORKING ASSUMPTION: the SecretStore/ClusterSecretStore resource that
# actually authenticates to Vault (via Vault's Kubernetes auth method,
# using THIS namespace's ServiceAccount as the identity) is provisioned
# ONCE per namespace by platform tooling (Terraform, see
# terraform/modules/namespace), not duplicated inside every service's
# Helm chart. This chart only declares WHAT secret it needs and WHERE
# from - not how the trust relationship to Vault is established. That
# separation means an app team can request a secret without ever being
# able to see or modify the Vault auth configuration itself.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "app.name" . }}-secret
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h    # picks up Vault-side rotation without a redeploy
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{ include "app.name" . }}-secret
    creationPolicy: Owner
    # deletionPolicy defaults to Retain, intentionally: if the
    # ExternalSecret CR is deleted by mistake, the underlying k8s Secret
    # (and therefore the running Pods' env) is not silently wiped.
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.vaultPath }}
        property: db_password
    - secretKey: API_SIGNING_KEY
      remoteRef:
        key: {{ .Values.secrets.vaultPath }}
        property: api_signing_key
{{- end }}
