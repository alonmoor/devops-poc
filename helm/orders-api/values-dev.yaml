image:
  repository: ghcr.io/alonmoor/orders-api
  tag: v1

replicaCount: 1
autoscaling:
  enabled: false

ingress:
  # Enabled even in dev so the full request path (Ingress -> orders-api ->
  # catalog-api) can be exercised locally against kind/minikube's own
  # ingress-nginx addon, not just via port-forward.
  enabled: true
  className: traefik
  host: "orders.dev.local"
  tlsSecretName: ""   # no TLS in dev - self-signed local ingress is enough

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 500m, memory: 64Mi }

podDisruptionBudget:
  enabled: false

secrets:
  enabled: true
  vaultPath: "secret/data/dev/orders-api"
