{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress

  ingress:
    # Only pods carrying the orders-api label, AND specifically in the
    # orders-dev namespace, may reach catalog-api. Both selectors sit
    # under the same "from" list item on purpose - that makes it an AND,
    # not an OR (two separate list items would mean "this label in ANY
    # namespace, OR any pod in that namespace" - much too permissive).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowFromNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.allowFromApp }}
      ports:
        - protocol: TCP
          port: 8080    
{{- end }}
