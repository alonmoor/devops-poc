name: Local Runner Test

on:
  workflow_dispatch:

jobs:
  test-on-keyboard-runner:
    runs-on: [self-hosted, linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test command
        run: |
          echo "Hello from my local self-hosted runner: ${{ runner.name }}"
          echo "Current OS: ${{ runner.os }}"
          uname -a
